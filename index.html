    <!-- ── PANTALLA DE CARGA: arranque con el logo ─────────────
         Va aquí (y no en React) para verse desde el primer pintado, antes de que
         llegue el JS de la tienda. 1) En la oscuridad se encienden dos focos que
         se vienen encima a toda velocidad entre rayas de luz. 2) Destello y
         aparece el logo dentro de un tacómetro: la aguja acelera hasta la zona
         roja, las marcas se encienden y todo vibra como motor en marcha.
         3) Al terminar la carga, salto a la velocidad de la luz hacia la página.
         Fluidez: solo anima transform/opacity, y nunca dos animaciones de la
         misma propiedad en un mismo elemento (se anidan elementos). -->
    <style>
      #lcp{position:fixed;inset:0;z-index:9999;overflow:hidden;color:#f4f4f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#030304;animation:lcp-gone .5s ease-in 8s forwards}
      #lcp.is-out{animation:lcp-gone .45s ease-in .35s forwards}
      #lcp .lcp-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(200,16,46,.32),transparent 58%),radial-gradient(ellipse at 50% 110%,rgba(232,185,35,.14),transparent 55%);opacity:0;animation:lcp-in .6s ease-out 1.15s forwards}
      /* Rayas de luz (túnel de velocidad) */
      #lcp .lcp-warp{position:absolute;left:50%;top:42%;opacity:0;animation:lcp-warp 2.2s ease-out .3s forwards}
      #lcp .lcp-ray{position:absolute;left:0;top:0;width:0;height:0}
      #lcp .lcp-ray i{position:absolute;left:0;top:-1px;width:22vmax;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));transform-origin:left center;opacity:0;animation:lcp-ray .62s cubic-bezier(.55,0,1,.6) infinite}
      #lcp .lcp-ray.is-gold i{background:linear-gradient(90deg,transparent,#E8B923)}
      #lcp .lcp-ray.is-red i{background:linear-gradient(90deg,transparent,#ff2a3d)}
      /* Focos que se vienen encima */
      #lcp .lcp-lights{position:absolute;left:50%;top:42%;width:56vmin;height:14vmin;margin:-7vmin 0 0 -28vmin;transform:scale(.05);opacity:0;animation:lcp-approach 1.25s cubic-bezier(.7,0,.95,.5) .1s forwards}
      #lcp .lcp-lamps{position:absolute;inset:0;animation:lcp-flicker .45s steps(1) .1s both}
      #lcp .lcp-lamp{position:absolute;top:0;width:14vmin;height:14vmin;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,rgba(255,246,214,.9) 30%,rgba(255,230,170,.35) 55%,transparent 72%)}
      #lcp .lcp-lamp:first-child{left:0}#lcp .lcp-lamp:nth-child(2){right:0}
      #lcp .lcp-flare{position:absolute;left:-30%;right:-30%;top:50%;height:3vmin;margin-top:-1.5vmin;background:radial-gradient(ellipse closest-side,#fff,rgba(190,215,255,.7) 35%,transparent)}
      #lcp .lcp-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff 0,rgba(255,250,235,.9) 30%,rgba(255,236,200,.25) 70%);opacity:0;animation:lcp-flash .7s ease-out 1.15s forwards}
      /* Escenario: tacómetro + logo + nombre */
      #lcp .lcp-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
      #lcp .lcp-pop{opacity:0;transform:scale(.55);animation:lcp-pop .7s cubic-bezier(.2,1.5,.4,1) 1.2s forwards}
      #lcp .lcp-shake{animation:lcp-shake .09s linear 1.3s 8}
      #lcp .lcp-gauge{position:relative;width:min(78vw,340px);aspect-ratio:1}
      #lcp .lcp-tick{position:absolute;left:50%;top:50%;width:0;height:0}
      #lcp .lcp-tick i{position:absolute;left:-1.5px;top:calc(min(78vw,340px) * -.485);width:3px;height:calc(min(78vw,340px) * .07);border-radius:2px;background:rgba(255,255,255,.14)}
      #lcp .lcp-tick.is-big i{left:-2px;width:4px;height:calc(min(78vw,340px) * .1);background:rgba(255,255,255,.22)}
      #lcp .lcp-tick i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#E8B923;box-shadow:0 0 8px #E8B923;opacity:0;animation:lcp-lit .25s ease-out calc(1.28s + var(--d) * .03s) forwards}
      #lcp .lcp-tick.is-red i::after{background:#ff2a3d;box-shadow:0 0 10px #ff2a3d;animation-name:lcp-lit-red;animation-duration:1.4s}
      #lcp .lcp-comet{position:absolute;inset:11%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,rgba(232,185,35,.15) 75%,#E8B923 96%,transparent 97%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:lcp-spin 1.1s linear 1.2s infinite}
      #lcp .lcp-needle{position:absolute;inset:0;transform:rotate(-120deg);animation:lcp-rev 1.7s cubic-bezier(.3,.7,.4,1) 1.25s forwards}
      #lcp .lcp-needle::before{content:"";position:absolute;left:50%;top:5.5%;width:0;height:0;margin-left:-7px;border:7px solid transparent;border-top:14px solid #ff2a3d;filter:drop-shadow(0 0 6px #ff2a3d)}
      #lcp .lcp-logo{position:absolute;inset:19%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(232,185,35,.55),0 0 60px rgba(200,16,46,.6)}
      #lcp .lcp-logo img{width:100%;height:100%;display:block}
      #lcp .lcp-logo::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-160%) skewX(-18deg);animation:lcp-shine .9s ease-in-out 1.75s forwards}
      #lcp .lcp-rpm{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:.6rem;font-weight:800;letter-spacing:.25em;color:rgba(244,244,245,.45)}
      #lcp .lcp-name{display:flex;gap:.06em;margin-top:.6rem;font-weight:900;font-size:clamp(1.5rem,7vw,2.3rem);letter-spacing:.14em;text-transform:uppercase}
      #lcp .lcp-name span{display:inline-block;opacity:0;transform:translateY(-.6em) scale(1.8);animation:lcp-slam .4s cubic-bezier(.2,1.4,.4,1) forwards}
      #lcp .lcp-name .is-gold{color:#E8B923}#lcp .lcp-name .lcp-gap{width:.35em}
      #lcp .lcp-sub{margin-top:.55rem;font-size:.66rem;font-weight:700;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;color:rgba(244,244,245,.6);opacity:0;animation:lcp-rise .5s ease-out 2.25s forwards}
      /* Salida: salto a la velocidad de la luz */
      #lcp.is-out .lcp-stage{animation:lcp-out .55s cubic-bezier(.6,0,.9,.4) forwards}
      #lcp.is-out .lcp-warp{animation:lcp-in .2s forwards;opacity:.35}
      #lcp.is-out .lcp-ray i{animation-duration:.3s}
      @keyframes lcp-in{to{opacity:1}}
      @keyframes lcp-warp{0%{opacity:0}20%,45%{opacity:1}70%,100%{opacity:.35}}
      @keyframes lcp-ray{0%{opacity:0;transform:translateX(2vmax) scaleX(.15)}25%{opacity:1}100%{opacity:1;transform:translateX(75vmax) scaleX(1.6)}}
      @keyframes lcp-approach{0%{opacity:0;transform:scale(.05)}12%{opacity:1}60%{transform:scale(.32)}82%{opacity:1}100%{opacity:0;transform:scale(9)}}
      @keyframes lcp-flicker{0%{opacity:1}15%{opacity:.1}30%{opacity:1}45%{opacity:.2}60%,100%{opacity:1}}
      @keyframes lcp-flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
      @keyframes lcp-pop{to{opacity:1;transform:scale(1)}}
      @keyframes lcp-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1.5px,1px)}75%{transform:translate(1px,1.5px)}}
      @keyframes lcp-lit{to{opacity:1}}
      @keyframes lcp-lit-red{0%{opacity:0}12%{opacity:1}30%{opacity:.4}45%{opacity:1}100%{opacity:.35}}
      @keyframes lcp-spin{to{transform:rotate(360deg)}}
      @keyframes lcp-rev{0%{transform:rotate(-120deg)}45%{transform:rotate(116deg)}55%{transform:rotate(104deg)}62%{transform:rotate(114deg)}100%{transform:rotate(30deg)}}
      @keyframes lcp-shine{to{transform:translateX(330%) skewX(-18deg)}}
      @keyframes lcp-slam{to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes lcp-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes lcp-out{to{opacity:0;transform:scale(3.2)}}
      @keyframes lcp-gone{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#lcp *,#lcp *::before,#lcp *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}#lcp .lcp-warp,#lcp .lcp-lights{display:none}}
    </style>
  </head>
  <body>
    <div id="lcp" aria-hidden="true">
      <div class="lcp-glow"></div>
      <div class="lcp-warp" id="lcp-warp"></div>
      <div class="lcp-lights"><div class="lcp-lamps"><span class="lcp-lamp"></span><span class="lcp-lamp"></span><span class="lcp-flare"></span></div></div>
      <div class="lcp-stage">
        <div class="lcp-pop">
          <div class="lcp-shake">
            <div class="lcp-gauge" id="lcp-gauge">
              <span class="lcp-comet"></span>
              <div class="lcp-needle"></div>
              <div class="lcp-logo"><img src="/preloader/lions-logo.webp" alt="" width="200" height="200" fetchpriority="high" /></div>
              <p class="lcp-rpm">RPM × 1000</p>
            </div>
          </div>
        </div>
        <p class="lcp-name" id="lcp-name">Lions Cars</p>
        <p class="lcp-sub">Automotriz · Puerto Varas</p>
      </div>
      <div class="lcp-flash"></div>
    </div>
    <script>
      // Arma las rayas de luz, las marcas del tacómetro y las letras; saca la
      // pantalla al terminar de cargar (mínimo 3 s para lucir el arranque; máximo 6 s).
      (function(){var el=document.getElementById("lcp");if(!el)return;var t0=Date.now(),done=0,h,i,a;
      for(h="",i=0;i<30;i++){a=i*12+(i*7%5)*2;h+='<span class="lcp-ray'+(i%5==0?" is-gold":i%7==0?" is-red":"")+'" style="transform:rotate('+a+'deg)"><i style="animation-delay:'+(.3+(i*37%62)/100)+'s"></i></span>'}
      document.getElementById("lcp-warp").innerHTML=h;
      // Marcas de -120° a 120°; la aguja las pasa entre 1,25 s y ~2 s; las 5 últimas, zona roja.
      for(h="",i=0;i<=24;i++){a=-120+i*10;h+='<span class="lcp-tick'+(i%3==0?" is-big":"")+(i>=20?" is-red":"")+'" style="transform:rotate('+a+'deg)"><i style="--d:'+i+'"></i></span>'}
      document.getElementById("lcp-gauge").insertAdjacentHTML("afterbegin",h);
      var n=document.getElementById("lcp-name"),w=n.textContent;n.innerHTML="";for(i=0;i<w.length;i++){var s=document.createElement("span");if(w[i]==" ")s.className="lcp-gap";else{s.textContent=w[i];if(i>5)s.className="is-gold"}s.style.animationDelay=(1.55+i*.06)+"s";n.appendChild(s)}
      function out(){el.className+=" is-out";setTimeout(function(){el.parentNode&&el.parentNode.removeChild(el)},900)}
      function hide(){if(done)return;done=1;setTimeout(out,Math.max(0,3000-(Date.now()-t0)))}
      if(document.readyState==="complete")hide();else addEventListener("load",hide);setTimeout(hide,6000)})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
