    <!-- ── PANTALLA DE CARGA: auto con el logo ──────────────────
         Va aquí (y no en React) para verse desde el primer pintado, antes de que
         llegue el JS de la tienda. Solo anima transform/opacity (fluido aunque
         la página esté cargando). El script de abajo la saca al cargar. -->
    <style>
      #lcp{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#f4f4f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        background:radial-gradient(ellipse at 50% 35%,rgba(200,16,46,.28),transparent 60%),radial-gradient(ellipse at 50% 110%,rgba(232,185,35,.12),transparent 55%),#050507;
        animation:lcp-gone .5s ease-in 8s forwards}
      #lcp.is-out{animation:lcp-gone .5s ease-in .45s forwards}
      #lcp .lcp-flash{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 30%,rgba(220,230,255,.55),transparent 70%);opacity:0;animation:lcp-flash 1.2s linear 1.15s forwards}
      #lcp .lcp-logo{position:relative;width:min(34vw,170px);aspect-ratio:1;margin-bottom:1.2rem;opacity:0;transform:scale(.3);animation:lcp-pop .6s cubic-bezier(.2,1.5,.4,1) 1.2s forwards}
      #lcp .lcp-logo img{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 2px rgba(232,185,35,.5),0 0 50px rgba(200,16,46,.55)}
      #lcp .lcp-ring{position:absolute;inset:0;border-radius:50%;border:3px solid #E8B923;opacity:0;animation:lcp-ring .8s ease-out 1.25s forwards}
      #lcp .lcp-scene{position:relative;width:min(86vw,520px)}
      #lcp .lcp-road{position:relative;height:6px;margin-top:-4px;border-radius:3px;background:#1b1b20;overflow:hidden}
      #lcp .lcp-dash{position:absolute;inset:0 -200% 0 0;background:repeating-linear-gradient(90deg,#E8B923 0 26px,transparent 26px 60px);opacity:.7;animation:lcp-road 1.1s cubic-bezier(.15,.6,.35,1) forwards}
      #lcp .lcp-car{position:relative;width:100%;aspect-ratio:320/120;transform:translateX(-130vw);animation:lcp-drive 1.1s cubic-bezier(.15,.6,.35,1) .05s forwards}
      #lcp .lcp-body{position:absolute;inset:0;transform-origin:85% 90%;animation:lcp-brake .45s ease-out 1.1s}
      #lcp .lcp-body svg{width:100%;height:100%;overflow:visible}
      #lcp .lcp-wheel{position:absolute;top:61.67%;width:13.75%;aspect-ratio:1}
      #lcp .lcp-wheel svg{width:100%;height:100%;animation:lcp-spin 1.15s cubic-bezier(.15,.6,.35,1) .05s forwards}
      #lcp .lcp-wheel--r{left:17.5%}
      #lcp .lcp-wheel--f{left:70%}
      #lcp .lcp-beam{position:absolute;left:94%;top:42%;width:55%;height:34%;background:linear-gradient(90deg,rgba(255,244,210,.75),rgba(255,244,210,0));clip-path:polygon(0 38%,100% 0,100% 100%,0 62%);transform-origin:left center;opacity:0;animation:lcp-beam .9s ease-out 1.1s forwards}
      #lcp .lcp-speed{position:absolute;right:100%;top:30%;width:60%;height:40%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.35) 0 2px,transparent 2px 11px);opacity:0;animation:lcp-speed 1.1s ease-out .05s forwards}
      #lcp .lcp-name{margin-top:1.3rem;font-weight:900;font-size:clamp(1.2rem,5vw,1.7rem);letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;opacity:0;transform:scale(1.5);animation:lcp-slam .45s cubic-bezier(.2,1.4,.4,1) 1.35s forwards}
      #lcp .lcp-name b{color:#C8102E}#lcp .lcp-name i{font-style:normal;color:#E8B923}
      #lcp .lcp-sub{margin-top:.5rem;font-size:.66rem;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:rgba(244,244,245,.6);opacity:0;animation:lcp-rise .5s ease-out 1.55s forwards}
      /* Salida: el auto acelera y se va por la derecha */
      #lcp.is-out .lcp-car{transform:translateX(0);animation:lcp-leave .7s cubic-bezier(.5,0,.85,.4) forwards}
      #lcp.is-out .lcp-wheel svg{animation:lcp-spin-out .7s linear forwards}
      @keyframes lcp-drive{to{transform:translateX(0)}}
      @keyframes lcp-leave{from{transform:translateX(0)}to{transform:translateX(130vw)}}
      @keyframes lcp-spin{from{transform:rotate(0)}to{transform:rotate(1800deg)}}
      @keyframes lcp-spin-out{from{transform:rotate(0)}to{transform:rotate(1440deg)}}
      @keyframes lcp-road{to{transform:translateX(-66%)}}
      @keyframes lcp-brake{0%,100%{transform:rotate(0)}35%{transform:rotate(2.2deg)}70%{transform:rotate(-.6deg)}}
      @keyframes lcp-beam{0%{opacity:0}20%{opacity:1}40%{opacity:.35}60%,100%{opacity:.85}}
      @keyframes lcp-speed{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
      @keyframes lcp-pop{to{opacity:1;transform:scale(1)}}
      @keyframes lcp-ring{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
      @keyframes lcp-flash{0%,100%{opacity:0}6%{opacity:1}12%{opacity:.2}20%{opacity:.8}35%{opacity:0}}
      @keyframes lcp-slam{to{opacity:1;transform:scale(1)}}
      @keyframes lcp-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes lcp-gone{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#lcp *{animation-duration:1ms!important;animation-delay:0s!important}}
    </style>
  </head>
  <body>
    <div id="lcp" aria-hidden="true">
      <div class="lcp-flash"></div>
      <div class="lcp-logo"><span class="lcp-ring"></span><img src="/preloader/lions-logo.webp" alt="" width="170" height="170" fetchpriority="high" /></div>
      <div class="lcp-scene">
        <div class="lcp-car">
          <span class="lcp-speed"></span>
          <div class="lcp-body">
            <svg viewBox="0 0 320 120">
              <defs>
                <linearGradient id="lcp-paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3d46"/><stop offset=".45" stop-color="#16171c"/><stop offset="1" stop-color="#0a0a0d"/></linearGradient>
                <linearGradient id="lcp-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b6478"/><stop offset=".5" stop-color="#1c2230"/><stop offset="1" stop-color="#0c0f16"/></linearGradient>
                <clipPath id="lcp-door"><circle cx="150" cy="70" r="19"/></clipPath>
              </defs>
              <ellipse cx="162" cy="108" rx="150" ry="6" fill="#000" opacity=".55"/>
              <path d="M18 92V74q2-12 16-16l58-8q28-24 68-26h46q20 2 40 22l44 10q16 4 16 18v16q0 4-6 4h-30a24 24 0 0 0-48 0H102a24 24 0 0 0-48 0H22q-4 0-4-2Z" fill="url(#lcp-paint)" stroke="#2b2d35" stroke-width="1.2"/>
              <path d="M100 50q24-18 58-19h42q16 2 32 16Z" fill="url(#lcp-glass)"/>
              <path d="M168 31v19" stroke="#0a0a0d" stroke-width="3"/>
              <path d="M30 79 300 71" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
              <path d="M32 84 298 77" stroke="#E8B923" stroke-width="1" opacity=".7"/>
              <path d="M294 60h10q2 0 2 3v4h-12Z" fill="#fff6d8"/>
              <path d="M18 64h8v8h-8Z" fill="#ff2a2a"/>
              <circle cx="150" cy="70" r="20.5" fill="#0a0a0d" stroke="#E8B923" stroke-width="1.4"/>
              <image href="/preloader/lions-logo.webp" x="131" y="51" width="38" height="38" clip-path="url(#lcp-door)"/>
            </svg>
          </div>
          <span class="lcp-beam"></span>
          <div class="lcp-wheel lcp-wheel--r"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#0d0d10"/><circle cx="22" cy="22" r="13.5" fill="#9ea1ab"/><g stroke="#3a3d46" stroke-width="3"><path d="M22 9v26M9 22h26M12.8 12.8l18.4 18.4M31.2 12.8 12.8 31.2"/></g><circle cx="22" cy="22" r="4" fill="#C8102E"/></svg></div>
          <div class="lcp-wheel lcp-wheel--f"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#0d0d10"/><circle cx="22" cy="22" r="13.5" fill="#9ea1ab"/><g stroke="#3a3d46" stroke-width="3"><path d="M22 9v26M9 22h26M12.8 12.8l18.4 18.4M31.2 12.8 12.8 31.2"/></g><circle cx="22" cy="22" r="4" fill="#C8102E"/></svg></div>
        </div>
        <div class="lcp-road"><span class="lcp-dash"></span></div>
      </div>
      <p class="lcp-name"><b>Lions</b> <i>Cars</i></p>
      <p class="lcp-sub">Automotriz · Puerto Varas</p>
    </div>
    <script>
      // Saca la pantalla de carga al terminar de cargar (mínimo 2,6 s para lucir la animación; máximo 6 s).
      (function(){var el=document.getElementById("lcp");if(!el)return;var t0=Date.now(),done=0;
      function out(){el.className+=" is-out";setTimeout(function(){el.parentNode&&el.parentNode.removeChild(el)},1000)}
      function hide(){if(done)return;done=1;setTimeout(out,Math.max(0,2600-(Date.now()-t0)))}
      if(document.readyState==="complete")hide();else addEventListener("load",hide);setTimeout(hide,6000)})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
