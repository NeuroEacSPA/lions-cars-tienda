# ─── NGINX config for lyonsactyon.cl ───────────────────────────────────────
# Place at: /etc/nginx/sites-available/lyonsactyon.cl
# Run: sudo nginx -s reload after changes

server {
    listen 80;
    listen [::]:80;
    server_name lyonsactyon.cl www.lyonsactyon.cl;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lyonsactyon.cl www.lyonsactyon.cl;

    root /home/neuro/lions-cars-tienda/dist;
    index index.html;

    # ── SSL (adjust paths to your cert) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/lyonsactyon.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyonsactyon.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── GZIP ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml text/x-component
        application/javascript application/json application/xml
        application/rss+xml font/truetype font/opentype
        application/vnd.ms-fontobject image/svg+xml;

    # ── BROTLI (needs ngx_brotli module) ────────────────────────
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── STATIC ASSETS — very long cache (Vite hashes filenames) ─
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── IMAGES — serve WebP if browser supports it ──────────────
    location ~* \.(png|jpe?g|gif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary Accept;

        # Serve .webp if the browser sends Accept: image/webp
        set $webp_suffix "";
        if ($http_accept ~* "webp") {
            set $webp_suffix ".webp";
        }
        try_files $uri$webp_suffix $uri =404;
    }

    # Serve pre-compressed .br files if browser supports it
    location ~* \.(js|css)$ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Try brotli first, then gzip, then original
        set $brotli_file "";
        if (-f $request_filename.br) {
            set $brotli_file "br";
        }
        if ($brotli_file = "br") {
            add_header Content-Encoding br;
            rewrite (.*) $1.br break;
        }
    }

    # ── API PROXY → backend FastAPI :4000 ───────────────────────
    location /autoefec {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /upload {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # ── SPA FALLBACK — all routes → index.html ──────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # index.html: no cache (always fetch fresh for SPA routing)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }

    # ── SECURITY HEADERS ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
